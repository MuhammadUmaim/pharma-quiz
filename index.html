nsform:translateY(-2px);background:#24534b;box-shadow:0 12px 25px #193b3830}.primary:active,.choice:active{transform:scale(.98)}.microcopy{font-size:12px;color:var(--muted);line-height:1.5}.source-note{font-size:11px;color:#82918c;margin:17px 0 0}.quiz-top{display:flex;justify-content:space-between;align-items:center;margin:3px 0 18px}.quiz-tag{font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.timer{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:99px;font-variant-numeric:tabular-nums;font-weight:750;box-shadow:0 5px 18px #243d3209}.timer-icon{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #e0f1e9}.timer.warning{color:#b8752e}.timer.warning .timer-icon{background:var(--orange);box-shadow:0 0 0 4px #fbefdf}.timer.urgent{color:var(--red);animation:pulse 1s infinite}.timer.urgent .timer-icon{background:var(--red);box-shadow:0 0 0 4px #f7e4e2}@keyframes pulse{50%{transform:scale(1.04)}}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:650;margin-bottom:10px}.progress{height:7px;border-radius:10px;background:#e7ede8;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#3a9d7e,#72bb92);border-radius:inherit;transition:width .35s ease}.quiz-card{padding:clamp(22px,5vw,43px);margin-top:21px;min-height:430px;display:flex;flex-direction:column}.topic-chip{font-size:11px;color:var(--green);background:#edf6f0;border-radius:99px;padding:7px 11px;font-weight:750;align-self:flex-start}.question{font:500 clamp(23px,4vw,34px)/1.27 Georgia,serif;letter-spacing:-.03em;margin:23px 0 24px;max-width:760px}.answers{display:grid;gap:10px}.answer{min-height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;padding:13px 15px;display:flex;align-items:center;gap:13px;color:#354f49;cursor:pointer;transition:all .18s}.answer:hover{border-color:#9bc8b5;transform:translateX(2px)}.answer-key{height:30px;width:30px;flex:0 0 30px;border-radius:10px;background:#f1f4f0;display:grid;place-items:center;color:#78908a;font-size:12px;font-weight:800}.answer.chosen{border-color:#64ad91;background:#eff7f2;box-shadow:inset 0 0 0 1px #64ad9133}.answer.chosen .answer-key{background:var(--green);color:white}.quiz-nav{margin-top:auto;padding-top:25px;display:flex;align-items:center;justify-content:space-between;gap:12px}.nav-group{display:flex;gap:9px}.secondary{min-height:48px;padding:0 17px;background:#fff;border:1px solid var(--line);border-radius:13px;color:#526a64;font-weight:700;cursor:pointer;transition:all .16s}.secondary:hover:not(:disabled){border-color:#9bc8b5;transform:translateY(-1px)}.secondary:disabled{opacity:.4;cursor:default}.primary.small{min-height:48px;padding:0 21px}.end-link{font-size:12px;color:#8b9893;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0}.result-card{padding:clamp(22px,5vw,38px);margin-bottom:19px}.result-summary{display:flex;align-items:center;gap:23px}.score-ring{width:114px;height:114px;flex:0 0 114px;border-radius:50%;background:conic-gradient(var(--green) var(--score),#e6eee8 0);display:grid;place-items:center;position:relative;animation:pop .6s both}.score-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}.score-number{position:relative;text-align:center;font:500 28px Georgia,serif;z-index:1}.score-number small{display:block;font:700 10px ui-sans-serif,system-ui;color:var(--muted);letter-spacing:.1em;margin-top:3px}@keyframes pop{from{transform:scale(.82);opacity:.4}to{transform:scale(1);opacity:1}}.result-summary h1{font:500 36px/1 Georgia,serif;letter-spacing:-.04em;margin:0 0 9px}.result-summary p{color:var(--muted);margin:0;line-height:1.5}.breakdown-title{display:flex;align-items:center;justify-content:space-between;margin:27px 0 14px}.breakdown-title h2{font:500 24px Georgia,serif;margin:0}.review-list{display:grid;gap:12px}.review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.review h3{font:600 16px/1.45 Georgia,serif;margin:0 0 12px}.review-line{font-size:13px;line-height:1.5;padding:8px 10px;border-radius:9px;margin-top:6px}.review-line.correct{color:#287354;background:#edf6f0}.review-line.wrong{color:#aa4644;background:#fbefed}.review-line.neutral{color:#788580;background:#f5f6f3}.review-line b{font-weight:750}.result-actions{display:flex;justify-content:center;margin:25px 0 8px}.empty-note{text-align:center;padding:20px;color:var(--muted)}.foot{text-align:center;color:#91a09a;font-size:11px;padding:26px 0 4px}
    @media(max-width:700px){.shell{padding:15px 16px calc(22px + env(safe-area-inset-bottom))}.top{padding-bottom:13px}.brand-sub{display:none}.hero{grid-template-columns:1fr;padding:21px 1px 27px;gap:18px}.hero h1{font-size:54px;margin:14px 0}.hero .lead{font-size:15px;margin:0}.art{height:130px;border-radius:22px;grid-row:1}.art:before{width:120px;height:120px}.art:after{width:180px;height:180px}.capsule{transform:rotate(-35deg) scale(.72)}.setup-card{padding:22px 18px 23px;border-radius:22px}.card-head{margin-bottom:20px}.card-head h2{font-size:26px}.pill{font-size:10px;padding:7px 9px}.choice{min-height:50px}.count-choices{grid-template-columns:repeat(3,1fr)}.start-row{align-items:flex-start;flex-direction:column;gap:11px}.primary.start{width:100%}.quiz-top{margin-top:3px}.quiz-card{min-height:min(590px,calc(100dvh - 205px));padding:21px 17px;border-radius:22px}.question{margin:20px 0 19px}.answer{min-height:57px;padding:12px;gap:10px}.quiz-nav{padding-top:19px}.end-link{font-size:11px}.secondary{padding:0 12px}.primary.small{padding:0 16px}.result-summary{gap:15px}.score-ring{width:86px;height:86px;flex-basis:86px}.score-ring:before{inset:6px}.score-number{font-size:23px}.result-summary h1{font-size:28px}.result-summary p{font-size:13px}.result-card{padding:20px 16px;border-radius:22px}.review{padding:14px}.review h3{font-size:15px}}

<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="brand-mark">✚</span><span>pharma<span style="color:var(--green)">practice</span></span></div><span class="brand-sub">A little practice, a lot more confidence</span></header>

  <script>
  (()=>{
    'use strict';
    const bank = [
      {topic:'Foundations',source:'pharmacology introduction',q:['Which branch studies drugs and their effects on living organisms?','A branch studies drug sources, properties, actions, uses, and effects on living organisms. Which is it?','A student examines a medicine’s sources, properties, actions, uses, and effects in an organism. Which branch of medical science applies?'],a:['Pharmacology','Toxicology','Pharmacodynamics','Pharmacotherapeutics'],c:0},
      {topic:'Foundations',source:'pharmacology introduction',q:['What does pharmacokinetics study?','Which description best matches pharmacokinetics?','A researcher tracks absorption, distribution, metabolism, and elimination after a dose. What field are they studying?'],a:['What the body does to the drug','What the drug does to the body','The harmful effects of chemicals','The use of drugs to treat disease'],c:0},

      {topic:'Foundations',source:'pharmacology introduction',q:['Which name is the company-given commercial name for paracetamol in the slides?','The slides distinguish chemical, generic, and brand names. Which is the commercial name given for paracetamol?','A label uses the company-given commercial name for paracetamol. Which name from the slides fits?'],a:['Panadol','Paracetamol','N-acetyl-para-aminophenol','Metformin'],c:0},
      {topic:'Pharmacokinetics',source:'1 Pharmacokinetics (1).pdf',q:['Which drug form crosses biomembranes according to the supplied PDF?','According to the ionization slide, which form of a drug crosses biomembranes?','A drug exists in ionized and nonionized forms. Which form is described as crossing biomembranes?'],a:['Nonionized (uncharged)','Ionized (charged)','Both forms equally','Neither form'],c:0},
      {topic:'Pharmacokinetics',source:'1 Pharmacokinetics (1).pdf',q:['Which form is better renally excreted?','The supplied ionization material says which form is water soluble and better cleared by the kidneys?','A drug form is water soluble and more readily cleared renally. Which form is it?'],a:['Ionized form','Nonionized form','Both equally','The protein-bound form'],c:0},
      {topic:'Pharmacokinetics',source:'pharmacology introduction',q:['Where does drug metabolism mainly occur?','The slides describe drug metabolism as chemical alteration mainly in which organ?','A drug is chemically altered before excretion. Which organ is identified as the main site?'],a:['Liver','Kidneys','Lungs','Stomach'],c:0},
      {topic:'Pharmacodynamics',source:'LECTURE 2',q:['A smaller EC₅₀ indicates what?','On a log dose-response curve, what does a smaller EC₅₀ indicate?','Drug A has a smaller EC₅₀ than drug B. Based on the lecture, which property is greater for A?'],a:['Potency','Efficacy','Toxicity','Therapeutic index'],c:0},
      {topic:'Pharmacodynamics',source:'LECTURE 2',q:['A partial agonist has what effect at a receptor?','Which statement best describes a partial agonist in the pharmacodynamics lecture?','A ligand binds a receptor but produces only partial activation and lower efficacy. What type of ligand is it?'],a:['It binds and partially activates it','It binds and completely blocks it','It reduces basal receptor activity','It binds a different receptor without effect'],c:0},
      {topic:'Pharmacodynamics',source:'LECTURE 2',q:['What does a larger therapeutic index indicate?','The lecture defines TI as TD₅₀/ED₅₀. What does a larger value suggest?','Comparing two drugs by TD₅₀/ED₅₀, which interpretation applies to the one with the larger ratio?'],a:['A wider margin between effective and toxic doses','A narrower margin between effective and toxic doses','Greater receptor potency','A faster onset of action'],c:0},
      {topic:'Autonomic nervous system',source:'ans lecture new',q:['Which division is associated with “rest and digest”?','Which autonomic division is described as dominant during “rest and digest”?','A patient’s autonomic activity is described as supporting digestion and elimination. Which division does the lecture associate with this state?'],a:['Parasympathetic','Sympathetic','Somatic','Enteric only'],c:0},
      {topic:'Autonomic nervous system',source:'ans lecture new',q:['Where are Nₙ nicotinic receptors found?','The lecture groups nicotinic receptors by location. Where are Nₙ receptors located?','A nicotinic acetylcholine receptor is located at an autonomic ganglion. Which subtype label is used in the slides?'],a:['Ganglia','Neuromuscular junction','Cardiac muscle','Adipose cells'],c:0},
      {topic:'Autonomic nervous system',source:'ans lecture new',q:['Which receptor subtype increases heart rate and force?','According to the receptor table, stimulation of which adrenoceptor increases heart rate and force?','A receptor in cardiac muscle raises heart rate and force when activated. Which subtype matches the supplied receptor table?'],a:['β₁','β₂','α₁','β₃'],c:0},
      {topic:'Autonomic nervous system',source:'ans lecture new',q:['Which drug is identified as a mixed-acting adrenomimetic?','Which example both increases norepinephrine release and activates adrenoceptors?','A drug has both direct and indirect adrenomimetic actions. Which example is given in the lecture?'],a:['Ephedrine','Cocaine','Phenylephrine','Pargyline'],c:0},
      {topic:'CNS',source:'1.-Classification-of-drugs-acting-on-CNS',q:['Which example is listed as a cortical CNS stimulant?','Which drug appears under cortical stimulants in the supplied classification?','A drug is grouped with amphetamine and methylxanthines as a cortical stimulant. Which is it?'],a:['Cocaine','Doxapram','Lobeline','Strychnine'],c:0},
      {topic:'CNS',source:'1.-Classification-of-drugs-acting-on-CNS',q:['What neurotransmitter receptor does caffeine block in the brain?','Which mechanism is listed for caffeine in the CNS stimulant examples?','A stimulant reduces feelings of tiredness by blocking brain adenosine receptors. Which drug is described?'],a:['Adenosine receptors','GABA receptors','Muscarinic receptors','Opioid receptors'],c:0},
      {topic:'CNS',source:'1.-Classification-of-drugs-acting-on-CNS',q:['Which inhibitory neurotransmitter is increased by most CNS depressants?','The supplied slides say most CNS depressants work by increasing which inhibitory neurotransmitter?','A CNS depressant produces sedation and reduced neuronal activity through increased inhibitory signaling. Which transmitter is named?'],a:['GABA','Dopamine','Norepinephrine','Serotonin'],c:0},
      {topic:'CNS',source:'1.-Classification-of-drugs-acting-on-CNS',q:['Which side effect is listed for methylphenidate?','Which effect appears among the listed methylphenidate adverse effects?','A patient taking a CNS stimulant develops tachycardia and sleep disturbance. Which listed drug has these effects in the supplied examples?'],a:['Weight loss','Constipation','Ankle edema','Hyperkalemia'],c:0},
      {topic:'Anesthesia',source:'6_Anesthesia_pptx',q:['Which channel do local anesthetics block?','How do local anesthetics prevent action-potential conduction according to the slides?','A local anesthetic reduces sodium influx and prevents membrane depolarization. Which channel does it block?'],a:['Voltage-dependent sodium channels','L-type calcium channels','Potassium channels','Ligand-gated chloride channels'],c:0},
      {topic:'Anesthesia',source:'6_Anesthesia_pptx',q:['Which stage of general anesthesia is used for surgery?','In which anesthesia stage do the slides say general surgery is performed?','A patient has reached the stage in which surgical procedures are performed. Which numbered anesthesia stage is this?'],a:['Stage III','Stage I','Stage II','Stage IV'],c:0},
      {topic:'Anesthesia',source:'6_Anesthesia_pptx',q:['Which agent is classified as a dissociative anesthetic?','Which drug is listed in the dissociative anesthetics group?','A general anesthetic is classified with tiletamine and phencyclidine. Which listed agent shares that group?'],a:['Ketamine','Propofol','Etomidate','Thiopental'],c:0},
      {topic:'Anesthesia',source:'6_Anesthesia_pptx',q:['Which effect can propofol cause following induction?','Which adverse effect is specifically listed for propofol?','After induction with propofol, which transient respiratory effect is described in the supplied slides?'],a:['Apnea','Bradycardia','Gallstones','Tinnitus'],c:0},
      {topic:'Opioids',source:'opioids',q:['Which opioid antagonist is the primary antidote for acute morphine poisoning?','The opioid lecture names which primary antidote for acute morphine poisoning?','A case of acute morphine poisoning requires reversal of opioid actions. Which listed antagonist is the primary antidote?'],a:['Naloxone','Naltrexone','Buprenorphine','Methadone'],c:0},

      {topic:'Opioids',source:'opioids',q:['Which peripheral opioid agonists are listed for diarrhea relief?','Which drugs are described as not crossing the blood-brain barrier and relieving diarrhea?','A peripherally acting μ agonist is selected to relieve diarrhea without crossing the BBB. Which pair is named in the lecture?'],a:['Loperamide and diphenoxylate','Morphine and codeine','Fentanyl and remifentanil','Naloxone and naltrexone'],c:0},

      {topic:'Hyperlipidemia',source:'Drugs Used for Hyperlipidemia',q:['Which enzyme do statins inhibit?','Statins lower cholesterol by inhibiting which rate-limiting enzyme?','A patient starts atorvastatin to reduce hepatic cholesterol synthesis. Which enzyme is its target in the slides?'],a:['HMG-CoA reductase','Lipoprotein lipase','NPC1L1','ATP citrate lyase'],c:0},
      {topic:'Hyperlipidemia',source:'Drugs Used for Hyperlipidemia',q:['Which drug class is best suited to hypertriglyceridemia in the summary?','Which class is identified as best for hypertriglyceridemia?','A patient’s treatment target is high triglycerides. Which lipid-lowering drug class is singled out for this in the slides?'],a:['Fibrates','Statins','Bile acid sequestrants','PCSK9 inhibitors'],c:0},
      {topic:'Antidepressants',source:'Antidepressant Drugs',q:['How do SSRIs increase serotonin signaling?','Which mechanism is given for SSRIs?','A drug blocks SERT so serotonin remains longer in the synaptic cleft. Which antidepressant class is it?'],a:['Block serotonin reuptake','Block MAO-B','Block dopamine receptors','Block α₂ receptors'],c:0},
      {topic:'Antidepressants',source:'Antidepressant Drugs',q:['Which antidepressant is identified as helping with smoking cessation?','Which atypical antidepressant is listed for smoking cessation?','A patient’s depression treatment may also aid smoking cessation. Which drug is named in the lecture?'],a:['Bupropion','Mirtazapine','Trazodone','Phenelzine'],c:0},
      {topic:'Antidepressants',source:'Antidepressant Drugs',q:['Which antidepressant is suggested for depression with insomnia?','Which antidepressant is paired with depression and insomnia in the treatment selection slide?','A patient has depression and insomnia; which drug’s sedating effect is given as a reason for selection?'],a:['Mirtazapine','Bupropion','Duloxetine','Fluoxetine'],c:0}
    ];
    const state={view:'setup',difficulty:'Medium',count:10,questions:[],answers:[],index:0,deadline:0,timer:null,remaining:0};
    const app=document.getElementById('app');
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const shuffle=items=>{const copy=items.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
    function renderSetup(){state.view='setup';clearInterval(state.timer);app.innerHTML=`<section class="screen"><div class="hero"><div><span class="eyebrow">Your study session</span><h1>Make every<br><em>minute count.</em></h1><p class="lead">A focused pharmacology quiz, drawn from your course material. Choose your pace and jump in.</p></div><div class="art" aria-hidden="true"><i class="art-dot"></i><i class="art-dot d2"></i><i class="art-dot d3"></i><div class="capsule"></div></div></div><section class="setup-card"><div class="card-head"><div><h2>Set up your quiz</h2><p>One minute per question. Take your time.</p></div><span class="pill">✦ &nbsp; 41 questions</span></div><div class="field-label">Choose difficulty</div><div class="choices" id="difficulty">${['Easy','Medium','Hard'].map(d=>`<button class="choice ${state.difficulty===d?'selected':''}" data-difficulty="${d}" aria-pressed="${state.difficulty===d}">${d}</button>`).join('')}</div><div class="field-label">Number of questions</div><div class="choices count-choices" id="count">${[10,15,20,25,30].map(n=>`<button class="choice ${state.count===n?'selected':''}" data-count="${n}" aria-pressed="${state.count===n}">${n}</button>`).join('')}</div><div class="start-row"><button class="primary start" id="start">Start quiz <span aria-hidden="true">→</span></button><span class="microcopy">Questions are shuffled every time.<br>Your answers stay on this device.</span></div><p class="source-note">Built from the supplied pharmacology slides and PDF. No account or network connection needed.</p></section></section>`;
      document.querySelectorAll('[data-difficulty]').forEach(button=>button.addEventListener('click',()=>{state.difficulty=button.dataset.difficulty;document.querySelectorAll('[data-difficulty]').forEach(option=>{const selected=option===button;option.classList.toggle('selected',selected);option.setAttribute('aria-pressed',String(selected))})}));
      document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{state.count=Number(button.dataset.count);document.querySelectorAll('[data-count]').forEach(option=>{const selected=option===button;option.classList.toggle('selected',selected);option.setAttribute('aria-pressed',String(selected))})}));
      document.getElementById('start').addEventListener('click',startQuiz);
    }
    function startQuiz(){state.questions=shuffle(bank).slice(0,state.count);state.answers=Array(state.questions.length).fill(null);state.index=0;state.remaining=state.count*60;state.deadline=Date.now()+state.remaining*1000;state.view='quiz';renderQuiz();state.timer=setInterval(updateTimer,250)}
    function updateTimer(){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));const node=document.getElementById('timer');if(node){document.getElementById('timer-value').textContent=timeText(state.remaining);node.classList.toggle('warning',state.remaining<=300&&state.remaining>60);node.classList.toggle('urgent',state.remaining<=60)}if(state.remaining<=0)submitQuiz(true)}
    const timeText=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    function renderQuiz(){const q=state.questions[state.index],answered=state.answers[state.index],pct=(state.index/state.questions.length)*100;app.innerHTML=`<section class="screen"><div class="quiz-top"><span class="quiz-tag">Pharma practice</span><div class="timer" id="timer" role="timer" aria-label="Time remaining"><i class="timer-icon"></i><span id="timer-value">${timeText(state.remaining)}</span></div></div><div class="progress-meta"><span>Question ${state.index+1} <span style="color:#a0aaa5">of</span> ${state.questions.length}</span><span>${Math.round(pct)}% complete</span></div><div class="progress" role="progressbar" aria-valuenow="${state.index+1}" aria-valuemin="1" aria-valuemax="${state.questions.length}"><div class="progress-fill" style="width:${pct}%"></div></div><article class="quiz-card"><span class="topic-chip">${esc(q.topic)}</span><h1 class="question">${esc(q.q[['Easy','Medium','Hard'].indexOf(state.difficulty)])}</h1><div class="answers" role="group" aria-label="Answer options">${q.a.map((answer,index)=>`<button class="answer ${answered===index?'chosen':''}" data-answer="${index}" aria-pressed="${answered===index}"><span class="answer-key">${String.fromCharCode(65+index)}</span><span>${esc(answer)}</span></button>`).join('')}</div><nav class="quiz-nav"><button class="end-link" id="finish">Finish quiz</button><div class="nav-group"><button class="secondary" id="prev" ${state.index===0?'disabled':''}>← Previous</button><button class="primary small" id="next">${state.index===state.questions.length-1?'Submit quiz':'Next →'}</button></div></nav></article></section>`;
      document.querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>{state.answers[state.index]=Number(button.dataset.answer);document.querySelectorAll('[data-answer]').forEach(option=>{const selected=option===button;option.classList.toggle('chosen',selected);option.setAttribute('aria-pressed',String(selected))})}));
      document.getElementById('prev').addEventListener('click',()=>{if(state.index>0){state.index--;renderQuiz()}});
      document.getElementById('next').addEventListener('click',()=>{if(state.index===state.questions.length-1)submitQuiz(false);else{state.index++;renderQuiz()}});
      document.getElementById('finish').addEventListener('click',()=>submitQuiz(false));
      updateTimer();
    }
    function submitQuiz(auto){if(state.view!=='quiz')return;clearInterval(state.timer);state.view='results';const score=state.answers.reduce((sum,answer,index)=>sum+(answer===state.questions[index].c?1:0),0),pct=Math.round(score/state.questions.length*100);app.innerHTML=`<section class="screen"><article class="result-card"><div class="result-summary"><div class="score-ring" style="--score:${pct*3.6}deg"><div class="score-number">${pct}%<small>SCORE</small></div></div><div><span class="eyebrow">${auto?'Time is up':'Session complete'}</span><h1>${score} / ${state.questions.length} correct</h1><p>${auto?'Your quiz was submitted when the timer ended.':score===state.questions.length?'Excellent work. A perfect round.':'Review the questions below and keep building on what you know.'}</p></div></div><div class="breakdown-title"><h2>Question review</h2><span class="pill">${state.questions.length} questions</span></div><div class="review-list">${state.questions.map((q,index)=>{const answer=state.answers[index],right=answer===q.c;return `<article class="review"><h3><span style="color:#8a9993;font-size:11px">${String(index+1).padStart(2,'0')} · ${esc(q.topic)}</span><br>${esc(q.q[['Easy','Medium','Hard'].indexOf(state.difficulty)])}</h3>${answer===null?'<div class="review-line neutral"><b>Not answered</b></div>':`<div class="review-line ${right?'correct':'wrong'}"><b>${right?'✓ Correct':'× Your answer'}:</b> ${esc(q.a[answer])}</div>`}<div class="review-line correct"><b>✓ Correct answer:</b> ${esc(q.a[q.c])}</div></article>`}).join('')}</div><div class="result-actions"><button class="primary" id="new">New quiz <span aria-hidden="true">↻</span></button></div></article></section>`;document.getElementById('new').addEventListener('click',renderSetup);window.scrollTo({top:0,behavior:'smooth'})}
    renderSetup();
  })();
  </script>
</body>
